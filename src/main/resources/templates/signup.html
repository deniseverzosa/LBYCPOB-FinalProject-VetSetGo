<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sign Up - VetSetGo')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container mt-5 flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Create a VetSetGo Account</h3>

          <form id="signupForm">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
              <label for="phoneNumber" class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="phoneNumber" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
          </form>

          <div class="text-center mt-3">
            <p class="mb-0">Already have an account? <a th:href="@{/login}">Login here</a></p>
          </div>

        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- 这一段是连接后端的 JavaScript 魔法 -->
<script>
  document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const dtoData = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      phoneNumber: document.getElementById('phoneNumber').value
    };

    const response = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dtoData)
    });

    if (response.ok) {
      const message = await response.text();
      alert(message);
      window.location.href = '/login';
    } else {
      alert("Sign up failed. Please check your inputs.");
    }
  });
</script>
</body>
</html>
