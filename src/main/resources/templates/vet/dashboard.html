<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Vet Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="container mt-5 flex-grow-1 vsg-bg-pattern">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2><span aria-hidden="true">🩺</span> <span th:text="'Welcome, ' + ${user.name}">Welcome, Dr. Vet</span></h2>
            <p class="text-muted mb-0" th:text="'License: ' + ${user.medicalLicense}"></p>
        </div>
        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
    <hr>

    <h4 class="mt-4"><span class="vsg-heading-icon" aria-hidden="true">📅</span>Upcoming Appointments</h4>
    <div class="table-responsive shadow-sm mt-3">
        <table class="table table-striped table-hover border align-middle bg-white mb-0">
            <thead class="table-primary">
            <tr>
                <th>Time Slot</th><th>Patient (Pet)</th><th>Owner</th><th>Service Requested</th>
                <th>Est. Price</th><th>Status / Update</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${#temporals.format(appt.timeSlot, 'yyyy-MM-dd HH:mm')}">Date/Time</td>
                <td th:text="${appt.pet.name}" class="fw-bold">Pet Name</td>
                <td th:text="${appt.owner.name}">Owner Name</td>
                <td><span class="badge bg-secondary" th:text="${appt.serviceType != null ? appt.serviceType : 'General Consultation'}">Service</span></td>
                <td class="text-success fw-bold" th:text="'₱' + ${appt.servicePrice != null ? appt.servicePrice : '500.0'}">Price</td>
                <td>
                    <form th:action="@{/vet/update-appointment}" method="post" class="d-flex">
                        <input type="hidden" name="appointmentId" th:value="${appt.id}"/>
                        <select name="status" class="form-select form-select-sm me-2" style="width: auto;">
                            <option th:selected="${appt.status.name() == 'PENDING'}" value="PENDING">Pending</option>
                            <option th:selected="${appt.status.name() == 'CONFIRMED'}" value="CONFIRMED">Confirmed</option>
                            <option th:selected="${appt.status.name() == 'COMPLETED'}" value="COMPLETED">Completed</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline-success">Save</button>
                    </form>
                </td>
                <td><a th:href="@{/vet/medical-history(petId=${appt.pet.name})}" class="btn btn-sm btn-info text-white">View Records</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="7" class="text-center text-muted py-4">No appointments scheduled for you at this time.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
