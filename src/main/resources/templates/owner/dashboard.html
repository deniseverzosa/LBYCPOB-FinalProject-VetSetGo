<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Owner Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container mt-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="'Welcome, ' + ${user.name}">Welcome, Owner</h2>
        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>

    <div th:if="${param.timeError}" class="alert alert-danger mb-4">
        Clinic hours are strictly between 9:00 AM and 5:00 PM. Please select a valid time.
    </div>

    <div class="row">
        <!-- Add Pet Form -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Register New Pet</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/owner/add-pet}" method="post">
                        <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="Pet Name" required></div>
                        <div class="mb-2"><input type="text" name="species" class="form-control" placeholder="Species (e.g., Dog)" required></div>
                        <div class="mb-2"><input type="text" name="breed" class="form-control" placeholder="Breed" required></div>
                        <div class="mb-2"><input type="number" name="age" class="form-control" placeholder="Age" required></div>
                        <div class="mb-2"><input type="number" step="0.1" name="weight" class="form-control" placeholder="Weight (kg)" required></div>
                        <div class="mb-3"><input type="text" name="allergies" class="form-control" placeholder="Allergies (Optional)"></div>
                        <button type="submit" class="btn btn-primary w-100">Add Pet</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- My Pets Roster -->
        <div class="col-md-8 mb-4">
            <h4 class="mb-3">My Pets</h4>
            <div class="row">
                <div th:each="pet : ${pets}" class="col-md-6 mb-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <h5 class="card-title text-primary" th:text="${pet.name}">Pet Name</h5>
                            <p class="mb-1"><strong>Species:</strong> <span th:text="${pet.species}"></span></p>
                            <p class="mb-1"><strong>Breed:</strong> <span th:text="${pet.breed}"></span></p>
                            <p class="mb-1"><strong>Allergies:</strong> <span th:text="${pet.allergies}"></span></p>
                            <div class="mt-3 d-flex gap-2">
                                <a th:href="@{/owner/pet-profile(name=${pet.name})}" class="btn btn-sm btn-info text-white w-50">View Profile</a>
                                <form th:action="@{/owner/delete-pet}" method="post" class="w-50">
                                    <input type="hidden" name="petId" th:value="${pet.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger w-100" onclick="return confirm('Delete this pet?');">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(pets)}" class="col-12">
                    <div class="alert alert-warning">You haven't registered any pets yet.</div>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-4">

    <!-- Appointment Booking -->
    <h4 class="mb-3">Book an Appointment</h4>
    <div class="card shadow-sm p-4 mb-5">
        <form th:action="@{/owner/book-appointment}" method="post" onsubmit="return validateBookingTime(this);">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">Select Pet</label>
                    <select name="petName" class="form-select" required>
                        <option value="" disabled selected>-- Choose Pet --</option>
                        <option th:each="pet : ${pets}" th:value="${pet.name}" th:text="${pet.name}"></option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">Select Veterinarian</label>
                    <select name="vetId" class="form-select" required>
                        <option value="" disabled selected>-- Choose Vet --</option>
                        <option th:each="vet : ${vets}" th:value="${vet.id}" th:text="${vet.name}"></option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">Service Required</label>
                    <select name="serviceType" class="form-select" required>
                        <option value="" disabled selected>-- Choose Service --</option>
                        <option value="General Consultation">General Consultation (₱500.00)</option>
                        <option value="Vaccination">Vaccination (₱1000.00)</option>
                        <option value="Surgery">Surgery (₱5000.00)</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label fw-bold">Date & Time</label>
                    <input type="datetime-local" name="timeSlot" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success mt-2">Confirm Booking</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
