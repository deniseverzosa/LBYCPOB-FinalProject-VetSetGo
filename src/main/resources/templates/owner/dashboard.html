<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Owner Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container mt-5 flex-grow-1">
    <h2 th:text="'Welcome, ' + ${user.name}">Welcome, Owner</h2>
    <hr>

    <h4 class="mt-4">My Pets</h4>
    <div class="row mt-3">
        <div class="col-md-4" th:each="pet : ${user.pets}">
            <div class="card shadow-sm mb-4 border-primary">
                <div class="card-body text-center">
                    <h5 class="card-title text-primary" th:text="${pet.name}">Pet Name</h5>
                    <p class="card-text text-muted" th:text="${pet.species}">Species</p>
                    <a th:href="@{/owner/pet-profile(name=${pet.name})}" class="btn btn-outline-primary btn-sm">View Profile</a>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mt-5">Book an Appointment</h4>

    <div th:if="${param.error != null}" class="alert alert-danger shadow-sm">
        <strong>Booking Failed:</strong> Appointments can only be scheduled between 9:00 AM and 5:00 PM.
    </div>

    <div class="card p-4 mb-5 shadow-sm bg-white">
        <form th:action="@{/owner/book-appointment}" method="post">
            <div class="row">
                <div class="col-md-5 mb-3">
                    <label class="form-label fw-bold">Select Pet</label>
                    <select name="petName" class="form-select" required>
                        <option th:each="p : ${user.pets}" th:value="${p.name}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="col-md-5 mb-3">
                    <label class="form-label fw-bold">Date & Time (9 AM - 5 PM)</label>
                    <input type="datetime-local" name="timeSlot" class="form-control" required>
                </div>
                <div class="col-md-2 mb-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Book</button>
                </div>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
