<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Owner Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container mt-5 flex-grow-1">
    <h2 th:text="'Welcome, ' + ${user.name}">Welcome, Owner</h2>
    <hr>
    <h4 class="mt-4">My Pets</h4>

    <div class="row mt-3">
        <div class="col-md-4" th:each="pet : ${user.pets}">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title text-primary" th:text="${pet.name}">Pet Name</h5>
                    <p class="card-text text-muted" th:text="${pet.species}">Species</p>
                    <a th:href="@{/owner/pet-profile(name=${pet.name})}" class="btn btn-outline-primary btn-sm">View Profile</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
