<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Owner Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="container mt-5 flex-grow-1 vsg-bg-pattern">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="'Welcome, ' + ${user.name}">Welcome, Owner</h2>
        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>

    <div th:if="${param.timeError}" class="alert alert-danger mb-4">
        Clinic hours are strictly between 9:00 AM and 5:00 PM. Please select a valid time.
    </div>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><span aria-hidden="true">🐾</span> Register New Pet</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/owner/add-pet}" method="post">
                        <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="Pet Name" required></div>
                        <div class="mb-2"><input type="text" name="species" class="form-control" placeholder="Species (e.g., Dog)" required></div>
                        <div class="mb-2"><input type="text" name="breed" class="form-control" placeholder="Breed" required></div>
                        <div class="mb-2"><input type="number" name="age" class="form-control" placeholder="Age" required></div>
                        <div class="mb-2"><input type="number" step="0.1" name="weight" class="form-control" placeholder="Weight (kg)" required></div>
                        <div class="mb-3"><input type="text" name="allergies" class="form-control" placeholder="Allergies (Optional)"></div>
                        <button type="submit" class="btn btn-primary w-100">Add Pet</button>
                    </form>
                </div>
            </div>
        </div>
