# ==========================================
# CORE APPLICATION SETTINGS
# ==========================================
# Application Name
spring.application.name=VetSetGo

# Server Port
server.port=8080

# Disable template cache during development so edits are picked up without restart
spring.thymeleaf.cache=false

server.error.include-message=always
server.error.include-binding-errors=always

# Logging configuration matching root package
logging.level.com.vetsetgo=DEBUG

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

# --- LOCAL DATABASE SETTINGS (Commented out for cloud deployment) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/petpulse_db
# spring.datasource.username=postgres
# spring.datasource.password=PetPulse

# --- SUPABASE CLOUD DATABASE SETTINGS ---
spring.datasource.url=jdbc:postgresql://[YOUR_SUPABASE_HOST]:6543/postgres
spring.datasource.username=[YOUR_SUPABASE_USER]
spring.datasource.password=[YOUR_SUPABASE_PASSWORD]
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & HIBERNATE SETTINGS
# ==========================================

# Create @Entity classes
spring.jpa.hibernate.ddl-auto=update

# SQL queries in the console for debugging purposes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect