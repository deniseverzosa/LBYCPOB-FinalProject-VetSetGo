# ==========================================
# CORE APPLICATION SETTINGS
# ==========================================
# Application Name
spring.application.name=VetSetGo
server.port=8080

# Disable template cache during development
spring.thymeleaf.cache=false

server.error.include-message=always
server.error.include-binding-errors=always
logging.level.com.vetsetgo=DEBUG

# ==========================================
# SUPABASE POSTGRESQL DATABASE SETTINGS (Step 4.4.5)
# ==========================================
# Replace with your actual Supabase JDBC Connection String
spring.datasource.url=jdbc:postgresql://[YOUR_POOLER_URL].pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.[YOUR_PROJECT_ID]
spring.datasource.password=[YOUR_DATABASE_PASSWORD]
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & HIBERNATE SETTINGS
# ==========================================
# IMPORTANT: Must be 'none' because schema is built via Supabase SQL Editor (Step 4.4.6)
spring.jpa.hibernate.ddl-auto=none

# SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SUPABASE STORAGE SETTINGS (Avatars)
# ==========================================
# Multipart upload limits for file uploads
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Project Settings -> API -> Project URL (Step 4.4.3)
app.supabase.url=https://[YOUR_PROJECT_ID].supabase.co

# Project Settings -> API Keys -> Secret Key (Step 4.4.4)
# NEVER commit the real key to version control (GitHub)
app.supabase.secret-key=[YOUR_SECRET_KEY_STARTS_WITH_sb_secret_]

# Must exist as a public bucket in Supabase Storage
app.supabase.avatar-bucket=avatars